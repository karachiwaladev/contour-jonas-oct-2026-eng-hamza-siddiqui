name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the coverage eval diffs against the base branch
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check JavaScript
        run: git ls-files '*.js' ':!:.claude/**' | xargs -r -n1 node --check
      - name: Unit tests
        run: node --test
      - name: Coverage eval self-tests
        run: node --test .claude/evals/test-coverage.test.mjs
      - name: PR risk eval self-tests
        run: node --test .claude/evals/pr-risk.test.mjs
      - name: Poisoned-ticket guard self-tests
        run: node --test .claude/guards/guards.test.mjs
      # Factory branches come from tickets, which may be poisoned: block guardrail
      # changes, planted instructions, outbound calls, install scripts and secrets.
      - name: PR guard (factory branches)
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'factory/')
        run: node .claude/guards/pr-guard.mjs --base "origin/${{ github.base_ref }}" --head HEAD
      - name: Coverage eval (new tests must add coverage)
        if: github.event_name == 'pull_request'
        run: node .claude/evals/test-coverage.mjs --base "origin/${{ github.base_ref }}"
      - name: PR risk eval (report only)
        if: github.event_name == 'pull_request'
        run: |
          {
            echo '### PR risk'
            echo '```'
            node .claude/evals/pr-risk.mjs --base "origin/${{ github.base_ref }}" --head HEAD
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
