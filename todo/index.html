<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <title>Todo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232563eb'/%3E%3Cpath d='M4 8.5l2.5 2.5L12 5.5' stroke='white' stroke-width='2' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Todo</h1>
    <form id="new-task">
      <input id="title" type="text" placeholder="What needs doing?" autocomplete="off" required>
      <div class="row">
        <label>Due <input id="due" type="date"></label>
        <label>Repeat
          <select id="repeat">
            <option value="">Does not repeat</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
          </select>
        </label>
        <label>Priority
          <select id="priority"></select>
        </label>
        <input id="tags" type="text" placeholder="Tags, comma separated" autocomplete="off">
        <button type="submit">Add</button>
      </div>
    </form>
    <div id="filters">
      <div class="status" role="group" aria-label="Filter by status">
        <button type="button" data-status="all" aria-pressed="true">All</button>
        <button type="button" data-status="active" aria-pressed="false">Incomplete</button>
        <button type="button" data-status="done" aria-pressed="false">Completed</button>
      </div>
      <label>Tag
        <select id="tag-filter"><option value="">All tags</option></select>
      </label>
      <label>Priority
        <select id="priority-filter"></select>
      </label>
    </div>
    <ul id="tasks"></ul>
    <p id="empty">No tasks yet.</p>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
